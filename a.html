<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タップDQ RPG</title>

<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff;text-align:center}
button{padding:12px 22px;margin:6px;border:none;border-radius:12px;font-size:18px}
#title,#stageSelect,#achievements{
 height:100vh;display:flex;flex-direction:column;
 justify-content:center;align-items:center
}
#game{display:none;padding:20px}
.enemy{font-size:90px;position:relative}
.bar{width:80%;height:18px;background:#444;margin:8px auto;border-radius:10px}
.hp{height:100%;background:red;border-radius:10px;transition:.2s}
.php{background:#0f0}
.damage{
 position:absolute;left:50%;top:50%;
 transform:translateX(-50%);
 color:yellow;font-size:28px;
 animation:float 1s forwards
}
@keyframes float{
 to{opacity:0;transform:translate(-50%,-60px)}
}
#popup,#achiPopup{
 position:fixed;inset:0;display:none;
 align-items:center;justify-content:center;
 background:rgba(0,0,0,.7);font-size:40px
}
.list{font-size:20px}
</style>
</head>

<body>
  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
<!-- ===== タイトル ===== -->
<div id="title">
<h1>⚔️ タップDQ RPG</h1>
<button onclick="openStage()">▶ ゲーム開始</button>
<button onclick="openAchievements()">🏆 実績</button>
<button onclick="deleteSave()">🗑 セーブ削除</button>
<button onclick="toggleBGM()">🎵 BGM ON / OFF</button>
</div>

<!-- ===== ステージ選択 ===== -->
<div id="stageSelect" style="display:none">
<h2>🌍 ステージ選択</h2>
<button onclick="startGame(0)">🌿 草原</button>
<button onclick="startGame(1)">🕳 洞窟</button>
<button onclick="startGame(2)">🏰 魔王城</button>
<button onclick="backTitle()">戻る</button>
</div>

<!-- ===== 実績 ===== -->
<div id="achievements" style="display:none">
<h2>🏆 実績</h2>
<div class="list" id="achiList"></div>
<button onclick="backTitle()">戻る</button>
</div>

<!-- ===== ゲーム ===== -->
<div id="game">

<div>
Lv <span id="level">1</span> /
💰 <span id="gold">10</span>G /
⚔️ ATK <span id="atk">1</span>
</div>

<div>
❤️ HP <span id="php">30</span>
<div class="bar"><div class="hp php" id="playerHp"></div></div>
</div>

<div>
🗡 剣Lv <span id="sword">0</span>
🛡 防具Lv <span id="armor">0</span>
</div>

<div class="enemy" id="enemy">🟢</div>
<div class="bar"><div class="hp" id="enemyHp"></div></div>

<button id="attack">攻撃</button>
<button id="skill">🔥 必殺</button>
<button id="heal">💊 回復(10G)</button>

<h3>🏪 ショップ</h3>
<button id="buySword">剣強化 (50G)</button>
<button id="buyArmor">防具強化 (50G)</button>
</div>

<div id="popup">LEVEL UP!</div>
<div id="achiPopup">🏆 実績解除！</div>

<script>
// ===== データ =====
const stages=[
 {name:"草原",hp:1,atk:1,gold:1},
 {name:"洞窟",hp:1.5,atk:1.5,gold:1.5},
 {name:"魔王城",hp:2,atk:2,gold:2}
];

const enemies=[
 {icon:"🟢",hp:20,atk:2,gold:5},
 {icon:"👺",hp:35,atk:4,gold:10}
];

const boss={icon:"🐉",hp:200,atk:8,gold:100};

// ===== 実績 =====
let achi={
 初回プレイ:false,
 初勝利:false,
 Lv10:false,
 ボス撃破:false,
 剣Lv5:false
};

// ===== 状態 =====
let stage=0,level=1,gold=10;
let swordLv=0,armorLv=0;
let playerMaxHp=30,playerHp=30;
let enemy,enemyHp,enemyMaxHp;
let firstBonusGiven=false;
let isBoss=false;

// ===== DOM =====
const $=id=>document.getElementById(id);

// ===== 計算 =====
function atk(){
 let d=1+swordLv*5;
 if(Math.random()<0.15)d*=2;
 return d;
}
function reduce(d){
 return Math.max(1,d-armorLv*2);
}

// ===== 敵生成 =====
function spawn(){
 const s=stages[stage];
 if(level%10===0){
  isBoss=true;
  enemy={...boss,atk:boss.atk*s.atk};
  enemyMaxHp=boss.hp*level*s.hp;
 }else{
  isBoss=false;
  const base=enemies[Math.floor(Math.random()*enemies.length)];
  enemy={...base,atk:base.atk*s.atk};
  enemyMaxHp=base.hp*level*s.hp;
 }
 enemyHp=enemyMaxHp;
 $("enemy").textContent=enemy.icon;
 update();
}

// ===== 表示 =====
function update(){
 $("enemyHp").style.width=(enemyHp/enemyMaxHp*100)+"%";
 $("playerHp").style.width=(playerHp/playerMaxHp*100)+"%";
 $("level").textContent=level;
 $("gold").textContent=Math.floor(gold);
 $("atk").textContent=atk();
 $("php").textContent=playerHp;
 $("sword").textContent=swordLv;
 $("armor").textContent=armorLv;
}

// ===== 攻撃 =====
$("attack").onclick=()=>{
 const d=atk();
 enemyHp-=d;
 showDamage(d);
 if(enemyHp<=0){
  gold+=enemy.gold*stages[stage].gold;
  if(isBoss) checkAchi("ボス撃破");
  levelUp();
  spawn();
  checkAchi("初勝利");
 }else{
  playerHp-=reduce(enemy.atk);
  if(playerHp<=0)gameOver();
 }
 update();
};

// ===== 必殺 =====
$("skill").onclick=()=>{
 const d=atk()*3;
 enemyHp-=d;
 showDamage(d);
 if(enemyHp<=0){
  gold+=enemy.gold*2;
  if(isBoss) checkAchi("ボス撃破");
  levelUp();
  spawn();
 }else{
  playerHp-=reduce(enemy.atk*1.5);
  if(playerHp<=0)gameOver();
 }
 update();
};

// ===== 回復 =====
$("heal").onclick=()=>{
 if(gold<10)return;
 gold-=10;
 playerHp=Math.min(playerMaxHp,playerHp+15);
 update();
};

// ===== 強化 =====
$("buySword").onclick=()=>{
 if(gold<50)return;
 gold-=50;
 swordLv++;
 if(swordLv>=5)checkAchi("剣Lv5");
 update();
};
$("buyArmor").onclick=()=>{
 if(gold<50)return;
 gold-=50;
 armorLv++;
 update();
};

// ===== レベル =====
function levelUp(){
 level++;
 playerMaxHp=30+level*5;
 playerHp=playerMaxHp;
 $("popup").style.display="flex";
 setTimeout(()=>$("popup").style.display="none",800);
 if(level>=10)checkAchi("Lv10");
 save();
}

// ===== 初回特典 =====
function firstPlayBonus(){
 if(firstBonusGiven)return;
 gold+=30;
 swordLv+=1;
 achi["初回プレイ"]=true;
 firstBonusGiven=true;
 alert("🎁 初回プレイ特典！\n・ゴールド +30\n・剣Lv +1");
 save();
}

// ===== 演出 =====
function showDamage(d){
 const el=document.createElement("div");
 el.className="damage";
 el.textContent="-"+Math.floor(d);
 $("enemy").appendChild(el);
 setTimeout(()=>el.remove(),1000);
}

// ===== 実績 =====
function checkAchi(k){
 if(achi[k])return;
 achi[k]=true;
 $("achiPopup").style.display="flex";
 setTimeout(()=>$("achiPopup").style.display="none",1000);
 save();
}
function openAchievements(){
 $("title").style.display="none";
 $("achievements").style.display="flex";
 $("achiList").innerHTML=
  Object.entries(achi).map(a=>`<div>${a[0]} : ${a[1]?"✔":"❌"}</div>`).join("");
}

// ===== セーブ =====
function save(){
 localStorage.setItem("save",JSON.stringify({
  level,gold,playerHp,swordLv,armorLv,achi,stage,firstBonusGiven
 }));
}
function load(){
 const d=JSON.parse(localStorage.getItem("save"));
 if(!d)return;
 ({level,gold,playerHp,swordLv,armorLv,achi,stage,firstBonusGiven}=d);
 playerMaxHp=30+level*5;
}

// ===== 画面 =====
function openStage(){
 $("title").style.display="none";
 $("stageSelect").style.display="flex";
}
function startGame(s){
 stage=s;
 $("stageSelect").style.display="none";
 $("game").style.display="block";
 load();
 firstPlayBonus();
 spawn();
 update();
 playBGM(); 
}
function backTitle(){location.reload();}
function gameOver(){alert("💀 GAME OVER");location.reload();}
function deleteSave(){
 if(confirm("セーブ削除しますか？")){
  localStorage.removeItem("save");
  alert("削除しました");
 }
}
// ===== BGM =====
const bgm = document.getElementById("bgm");
let bgmOn = true;

function playBGM(){
  if(!bgmOn) return;
  bgm.volume = 0.4;   // 音量（0〜1）
  bgm.play().catch(()=>{});
}

function stopBGM(){
  bgm.pause();
}

function toggleBGM(){
  bgmOn = !bgmOn;
  if(bgmOn){
    playBGM();
    alert("🎵 BGM ON");
  }else{
    stopBGM();
    alert("🔇 BGM OFF");
  }
}

</script>
</body>
</html>
