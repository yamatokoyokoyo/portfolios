<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タップDQ RPG 拡張版</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff;text-align:center}
button{padding:12px 22px;margin:6px;border:none;border-radius:12px;font-size:18px;cursor:pointer}
#title,#stageSelect,#achievements{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
#game{display:none;padding:20px}
.enemy{font-size:90px;position:relative;transition:transform .2s}
.bar{width:80%;height:18px;background:#444;margin:8px auto;border-radius:10px;overflow:hidden}
.hp{height:100%;background:red;border-radius:10px;transition:.2s}
.php{background:#0f0}
.damage{position:absolute;left:50%;top:50%;transform:translateX(-50%);color:yellow;font-size:28px;animation:float 1s forwards}
@keyframes float{to{opacity:0;transform:translate(-50%,-60px)}}
#popup,#achiPopup,#itemPopup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);font-size:40px}
.list{font-size:20px}
#autobattle{margin:10px;padding:10px 20px;font-size:18px;border-radius:10px}
</style>
</head>
<body>
<audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

<!-- タイトル -->
<div id="title">
<h1>⚔️ タップDQ RPG 拡張版</h1>
<button onclick="openStage()">▶ ゲーム開始</button>
<button onclick="openAchievements()">🏆 実績</button>
<button onclick="deleteSave()">🗑 セーブ削除</button>
<button onclick="toggleBGM()">🎵 BGM ON / OFF</button>
</div>

<!-- ステージ選択 -->
<div id="stageSelect" style="display:none">
<h2>🌍 ステージ選択</h2>
<button onclick="startGame(0)">🌿 草原</button>
<button onclick="startGame(1)">🕳 洞窟</button>
<button onclick="startGame(2)">🏰 魔王城</button>
<button onclick="backTitle()">戻る</button>
</div>

<!-- 実績 -->
<div id="achievements" style="display:none">
<h2>🏆 実績</h2>
<div class="list" id="achiList"></div>
<button onclick="backTitle()">戻る</button>
</div>

<!-- ゲーム -->
<div id="game">
<div>
Lv <span id="level">1</span> / 💰 <span id="gold">10</span>G / ⚔️ ATK <span id="atk">1</span>
</div>
<div>
❤️ HP <span id="php">30</span>
<div class="bar"><div class="hp php" id="playerHp"></div></div>
</div>
<div>
🗡 剣Lv <span id="sword">0</span> 🛡 防具Lv <span id="armor">0</span> 🔥 スキルLv <span id="skillLv">0</span>
</div>
<div>
🧪 ポーション: <span id="potionCount">0</span> / 🔥 スキルアイテム: <span id="skillItemCount">0</span>
</div>
<div class="enemy" id="enemy">🟢</div>
<div class="bar"><div class="hp" id="enemyHp"></div></div>
<div id="enemyInfo"></div>

<button id="attack">攻撃</button>
<button id="skill">🔥 必殺</button>
<button id="heal">💊 回復(10G)</button>
<button id="usePotion">🧪 ポーション使用</button>
<button id="useSkillItem">🔥 スキルアイテム使用</button>
<button id="autobattle">自動戦闘 OFF</button>

<h3>🏪 ショップ</h3>
<button id="buySword">剣強化 (50G)</button>
<button id="buyArmor">防具強化 (50G)</button>
<button id="buySkill">スキル強化 (100G)</button>
<button id="buyPotion">🧪 ポーション購入 (5G)</button>
<button id="buySkillItem">🔥 スキルアイテム購入 (20G)</button>
</div>

<div id="popup">LEVEL UP!</div>
<div id="achiPopup">🏆 実績解除！</div>
<div id="itemPopup"></div>
<button id="backToTitle">🏠 タイトルに戻る</button>

<script>
// ===== データ =====
const stages=[
 {name:"草原",hp:1,atk:1,gold:1},
 {name:"洞窟",hp:1.5,atk:1.5,gold:1.5},
 {name:"魔王城",hp:2,atk:2,gold:2}
];

const enemies=[
 {icon:"🟢", hp:20, atk:2, gold:5, name:"スライム", stage:0},
 {icon:"🐇", hp:15, atk:1, gold:4, name:"ウサギモンスター", stage:0},
 {icon:"🦋", hp:10, atk:1, gold:3, name:"蝶モンスター", stage:0},
 {icon:"👺", hp:35, atk:4, gold:10, name:"ゴブリン", stage:1},
 {icon:"🕷", hp:25, atk:3, gold:8, name:"ジャイアントスパイダー", stage:1},
 {icon:"🦇", hp:20, atk:3, gold:7, name:"コウモリ", stage:1},
 {icon:"🦌", hp:100, atk:6 ,gold:7, name:"デビルディア", stage:2},
 {icon:"💀", hp:60, atk:7, gold:12, name:"骸骨兵士", stage:2},
 {icon:"👹", hp:150, atk:10, gold:15, name:"悪鬼", stage:2}
];

const boss={icon:"🐉", hp:200, atk:10, gold:100, name:"ドラゴン"};

let achi={
 初回プレイ:false, 初勝利:false, Lv10:false,
 ボス撃破:false, 剣Lv5:false, 敵10体撃破:false, 連続コンボ5回:false
};

// ===== 状態 =====
let stage=0, level=1, gold=10;
let swordLv=0, armorLv=0, skillLv=0;
let playerMaxHp=30, playerHp=30;
let enemy, enemyHp, enemyMaxHp;
let firstBonusGiven=false;
let isBoss=false;
let autoBattle=false;
let critStreak=0, combo=0, defeatedEnemies=0;
let potionCount=0, skillItemCount=0;

// ===== DOM =====
const $=id=>document.getElementById(id);

// ===== 計算 =====
function atk(){
 let d=1+swordLv*5;
 if(Math.random()<0.15){
   d*=2; critStreak++; combo++;
   if(combo>=5) checkAchi("連続コンボ5回");
 } else { critStreak=0; combo=0; }
 return d;
}
function reduce(d){ return Math.max(1,d-armorLv*2); }

// ===== 敵生成 =====
function spawn(){
  const s = stages[stage];
  if(stage === 2 && level % 10 === 0){
    isBoss = true;
    enemy = {...boss, atk: boss.atk * s.atk, hp: boss.hp * level * s.hp};
    enemyMaxHp = enemy.hp;
  } else {
    isBoss = false;
    const stageEnemies = enemies.filter(e => e.stage === stage);
    const base = stageEnemies[Math.floor(Math.random()*stageEnemies.length)];
    enemy = {...base, atk: base.atk * s.atk, hp: base.hp * level * s.hp};
    enemyMaxHp = enemy.hp;
  }
  enemyHp = enemyMaxHp;
  $("enemy").textContent = enemy.icon;
  $("enemyInfo").textContent = `${enemy.name} HP:${Math.floor(enemyHp)}`;
  update();
}

// ===== 表示 =====
function update(){
 $("enemyHp").style.width = (enemyHp/enemyMaxHp*100) + "%";
 $("playerHp").style.width = (playerHp/playerMaxHp*100) + "%";
 $("level").textContent = level;
 $("gold").textContent = Math.floor(gold);
 $("atk").textContent = atk();
 $("php").textContent = Math.floor(playerHp);
 $("sword").textContent = swordLv;
 $("armor").textContent = armorLv;
 $("skillLv").textContent = skillLv;
 $("potionCount").textContent = potionCount;
 $("skillItemCount").textContent = skillItemCount;
}

// ===== ダメージ演出 =====
function showDamage(d,color="yellow"){
 const el=document.createElement("div");
 el.className="damage";
 el.style.color=color;
 el.textContent=(d>=0?'-'+Math.floor(d):'+'+Math.floor(-d));
 $("enemy").appendChild(el);
 setTimeout(()=>el.remove(),1000);
}

// ===== 攻撃 =====
$("attack").onclick=()=> attackEnemy(atk());
function attackEnemy(d){
 enemyHp -= d;
 showDamage(d, "yellow");
 if(enemyHp <=0){
   enemyHp=0;
   gold += enemy.gold*stages[stage].gold;
   defeatedEnemies++;
   dropItem();
   if(isBoss) checkAchi("ボス撃破");
   if(defeatedEnemies>=10) checkAchi("敵10体撃破");
   levelUp();
   spawn();
   checkAchi("初勝利");
 } else enemyAttack();
 update();
}

// ===== 敵攻撃 =====
function enemyAttack(){
 let d=reduce(enemy.atk);
 playerHp -= d;
 showDamage(d,"red");
 if(playerHp <=0) gameOver();
 update();
}

// ===== 必殺 =====
$("skill").onclick=()=>{
 if(skillLv<=0) return;
 const d=atk()*2 + skillLv*5;
 enemyHp -= d;
 showDamage(d,"orange");
 if(enemyHp<=0){
   enemyHp=0;
   gold += enemy.gold*2;
   dropItem();
   if(isBoss) checkAchi("ボス撃破");
   levelUp();
   spawn();
 } else enemyAttack();
 update();
};

// ===== ポーション・スキルアイテム使用 =====
$("usePotion").onclick = () => {
 if(potionCount <= 0) return alert("ポーションがありません");
 potionCount--;
 const healAmount = 15 + skillLv*3;
 playerHp += healAmount;
 if(playerHp > playerMaxHp) playerHp = playerMaxHp;
 showDamage(-healAmount,"green");
 update();
 save();
};

$("useSkillItem").onclick = () => {
 if(skillItemCount <= 0) return alert("スキルアイテムがありません");
 skillItemCount--;
 skillLv++;
 $("itemPopup").textContent = `🔥 スキルLv +1`;
 $("itemPopup").style.display="flex";
 setTimeout(()=>{$("itemPopup").style.display="none";},1000);
 update();
 save();
};

// ===== 回復ボタン =====
$("heal").onclick = () => {
 if(gold<10) return;
 gold -=10;
 const healAmount = Math.min(playerMaxHp - playerHp, 15 + skillLv*3);
 playerHp += healAmount;
 if(playerHp>playerMaxHp) playerHp = playerMaxHp;
 showDamage(-healAmount,"green");
 setTimeout(()=>enemyAttack(),500);
 update();
};

// ===== アイテムドロップ =====
function dropItem(){
 if(Math.random()<0.3){
   potionCount++;
   $("itemPopup").textContent = `🧪 ポーション獲得！ 所持数: ${potionCount}`;
   $("itemPopup").style.display="flex";
   setTimeout(()=>{$("itemPopup").style.display="none";},1000);
 } else if(Math.random()<0.2){
   skillItemCount++;
   $("itemPopup").textContent = `🔥 スキルアイテム獲得！ 所持数: ${skillItemCount}`;
   $("itemPopup").style.display="flex";
   setTimeout(()=>{$("itemPopup").style.display="none";},1000);
 }
 update();
 save();
}

// ===== 強化 =====
$("buySword").onclick=()=>{
 if(gold<50) return alert("ゴールドが足りません");
 gold-=50; swordLv++;
 if(swordLv>=5) checkAchi("剣Lv5");
 update();
};
$("buyArmor").onclick=()=>{
 if(gold<50) return alert("ゴールドが足りません");
 gold-=50; armorLv++;
 update();
};
$("buySkill").onclick=()=>{
 if(gold<100) return alert("ゴールドが足りません");
 gold-=100; skillLv++;
 update();
};
// ===== ポーション購入 =====
$("buyPotion").onclick=()=>{
 if(gold<5) return alert("ゴールドが足りません");
 gold -=5;
 potionCount++;
 $("itemPopup").textContent = `🧪 ポーション購入！ 所持数: ${potionCount}`;
 $("itemPopup").style.display="flex";
 setTimeout(()=>{$("itemPopup").style.display="none";},1000);
 update();
 save();
};
// ===== スキルアイテム購入 =====
$("buySkillItem").onclick=()=>{
 if(gold<20) return alert("ゴールドが足りません");
 gold -=20;
 skillItemCount++;
 $("itemPopup").textContent = `🔥 スキルアイテム購入！ 所持数: ${skillItemCount}`;
 $("itemPopup").style.display="flex";
 setTimeout(()=>{$("itemPopup").style.display="none";},1000);
 update();
 save();
};
// ===== レベルアップ =====
function levelUp(){
 level++;
 playerMaxHp = 30 + level*5;
 playerHp = playerMaxHp;
 $("popup").style.display="flex";
 setTimeout(()=>$("popup").style.display="none",800);
 if(level>=10) checkAchi("Lv10");
 save();
 update();
}

// ===== 自動戦闘 =====
$("autobattle").onclick=()=>{
 autoBattle = !autoBattle;
 $("autobattle").textContent = autoBattle?"自動戦闘 ON":"自動戦闘 OFF";
 if(autoBattle) autoBattleLoop();
};
function autoBattleLoop(){
 if(!autoBattle || playerHp<=0) return;
 attackEnemy(atk());
 setTimeout(autoBattleLoop,800);
}

// ===== 初回特典 =====
function firstPlayBonus(){
 if(firstBonusGiven) return;
 gold+=30; swordLv+=1;
 achi["初回プレイ"]=true; firstBonusGiven=true;
 alert("🎁 初回プレイ特典！\n・ゴールド +30\n・剣Lv +1");
 save();
}

// ===== 実績 =====
function checkAchi(k){
 if(achi[k]) return;
 achi[k]=true;
 $("achiPopup").style.display="flex";
 setTimeout(()=>$("achiPopup").style.display="none",1000);
 save();
}
function openAchievements(){
 $("title").style.display="none";
 $("achievements").style.display="flex";
 $("achiList").innerHTML = Object.entries(achi).map(a=>`<div>${a[0]} : ${a[1]?"✔":"❌"}</div>`).join("");
}

// ===== セーブ/ロード =====
function save(){
 localStorage.setItem("save",JSON.stringify({
   level,gold,playerHp,swordLv,armorLv,skillLv,achi,stage,
   firstBonusGiven,defeatedEnemies,critStreak,combo,
   potionCount, skillItemCount
 }));
}
function load(){
 const d = JSON.parse(localStorage.getItem("save"));
 if(!d) return;
 ({
   level,gold,playerHp,swordLv,armorLv,skillLv,achi,firstBonusGiven,
   defeatedEnemies,critStreak,combo,potionCount,skillItemCount
 } = d);
 playerMaxHp = 30 + level*5;
 update();
}

// ===== 画面遷移 =====
function openStage(){ $("title").style.display="none"; $("stageSelect").style.display="flex"; }
function startGame(s){
 stage = s;
 $("stageSelect").style.display="none";
 $("game").style.display="block";
 load();
 firstPlayBonus();
 spawn();
 update();
 playBGM();
}
function backTitle(){ location.reload(); }
function gameOver(){ alert("💀 GAME OVER"); location.reload(); }
function deleteSave(){ if(confirm("セーブ削除しますか？")){ localStorage.removeItem("save"); alert("削除しました"); } }

// ===== BGM =====
const bgm = $("bgm"); let bgmOn=true;
function playBGM(){ if(!bgmOn) return; bgm.volume=0.4; bgm.play().catch(()=>{}); }
function stopBGM(){ bgm.pause(); }
function toggleBGM(){ bgmOn=!bgmOn; if(bgmOn){ playBGM(); alert("🎵 BGM ON"); }else{ stopBGM(); alert("🔇 BGM OFF"); } }

// タイトル戻る
$("backToTitle").onclick = () => {
 if(confirm("タイトルに戻りますか？進行中のデータは保存されます。")) {
   save();
   backTitle();
 }
};
</script>
</body>
</html>
